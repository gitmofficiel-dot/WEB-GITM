          <section>
            <h2>من نحن - About GITM</h2>
            <p>GITM (Groupe Innovation Technologique Maroc) هي مجموعة الابتكار التكنولوجي بالمغرب، منصة وطنية مغربية رائدة تأسست في يونيو 2026 على يد محمد غزاوني (MOHAMMED RHZAOUNI) من مدينة وادي زم بجهة بني ملال - خنيفرة بالمغرب.</p>
            <p>GITM is a leading Moroccan national technology innovation platform founded in June 2026 by Mohammed Rhzaouni from Oued Zem, Beni Mellal-Khénifra region, Morocco.</p>
            <p>تهدف المجموعة إلى تطوير مشاريع في الذكاء الاصطناعي (AI)، الروبوتات، إنترنت الأشياء (IoT)، الأنظمة المدمجة (Embedded Systems)، والمدن الذكية (Smart Cities). من أبرز مشاريعها: نبض إكس (NABD-X) للمدن الذكية، والروبوت المجنزر علي (Ali).</p>
            <p>The organization focuses on AI, Robotics, IoT, Embedded Systems, and Smart Cities. Key projects include NABD-X for smart cities and the Ali tracked robot.</p>
          </section>
          <section>
            <h2>المؤسس - Founder</h2>
            <p>محمد غزاوني (MOHAMMED RHZAOUNI)، مواليد 31 يناير 2004 بمدينة وادي زم، المغرب. مؤسس ورئيس مجموعة الابتكار التكنولوجي بالمغرب GITM. متخصص في الروبوتات والذكاء الاصطناعي والأنظمة المدمجة وبروتوكولات تشخيص السيارات. مطور مشروع نبض إكس NABD-X للمدن الذكية ومبتكر الروبوت المجنزر علي Ali.</p>
            <p>Mohammed Rhzaouni (born January 31, 2004 in Oued Zem, Morocco) is the Founder and President of GITM. He specializes in Robotics, AI, Embedded Systems, and automotive diagnostic protocols. He developed the NABD-X smart city project and created the Ali tracked robot.</p>
          </section>
